# Site nginx para erp.ia365.com.br — padrão sp1-sd-iautomation-1
# Instalar em /etc/nginx/sites-available/erp.ia365.com.br (symlink em sites-enabled)
# O bloco SSL é adicionado depois pelo certbot (--nginx --redirect).
server {
    listen 80;
    server_name erp.ia365.com.br;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
