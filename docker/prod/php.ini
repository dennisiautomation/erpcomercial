; Otimizações de produção
memory_limit = 512M
upload_max_filesize = 40M
post_max_size = 48M   ; pedaços do vídeo de treinamento (nginx do host aceita 50M)
max_execution_time = 120
date.timezone = America/Sao_Paulo
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit_buffer_size = 100M
opcache.jit = tracing

; Formulários grandes (etiquetas com centenas de produtos, imports)
max_input_vars = 10000

; CVE-2026-115560 (php.net 23/10/2026): RCE via session upload progress, sem correção ainda — manter desligado até a próxima versão do PHP
session.upload_progress.enabled = 0
